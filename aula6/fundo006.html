<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estelizando elementos da div</title>
    <style>
        #container{
            position:relative;
            height: 94vh;
            background-color: blue;
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            padding: 10px;
            
        }
        #conteudo{
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            position:absolute;
            height:200px;
            width: 300px;
            background-color: yellow;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
            
            
        }
    </style>
</head>
<body>
    <div id="container">
        <section id="conteudo"></section>
    </div>
</body>
</html>
