<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{
            font-family:Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        table{
            width:300px;
            height: 400px;
            border-collapse:collapse;
            margin: auto;
        }
        tr.cor{
            background-color: lightgray;
        }
        td.cor1{
            background-color: blue;
        }
        td{
            border: 3px solid black;
            padding: 5px;
            text-align:center;
            vertical-align: bottom;
        }
    </style>
</head>
<body> 
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="cor">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
            <td class="cor1">D3</td>
        </tr>
    </table>
</body>
</html>
